# Booking service validation messages
DISPLAY_NOT_FOUND=Display nicht gefunden.
DISPLAY_INACTIVE=Das Display ist inaktiv.
DISPLAY_TOKEN_INVALID=Ungültiger Display-Token.
DEEP_WRITE_UNSUPPORTED=Verwende das Feld {0}_ID oder den Endpunkt des zugehörigen Eintrags. Verschachtelte Schreibzugriffe werden nicht unterstützt.
ENTRY_NOT_FOUND=Eintrag in {0} nicht gefunden.
FIELD_REQUIRED={0} ist erforderlich.
REFERENCE_MISSING={0} verweist auf einen fehlenden Eintrag in {1}.
ENTRY_INACTIVE=Der Eintrag in {0} ist inaktiv.
COMPANY_MISMATCH=Verknüpfte Einträge müssen zum selben Unternehmen gehören.
PARENT_IMMUTABLE=Die übergeordnete Zuordnung {0} kann nicht geändert werden. Erstelle einen neuen Eintrag unter der gewünschten Zuordnung.
DOMAIN_INVALID=Gib einen Domainnamen wie example.com ein, ohne URL oder E-Mail-Adresse.
PRIMARY_DOMAIN_EXISTS=Das Unternehmen hat bereits eine aktive primäre Domain.
TIME_ZONE_INVALID=Verwende eine IANA-Zeitzone wie Europe/Berlin.
TIME_ZONE_REQUIRED=Eine Zeitzone ist erforderlich.
LOCALE_INVALID=Verwende eine gültige Sprachkennung wie de-DE.
COUNTRY_INVALID=Verwende einen Ländercode aus zwei Buchstaben.
EMAIL_INVALID=Gib eine gültige E-Mail-Adresse ein.
SVG_INVALID=Lade einen eigenständigen SVG-Plan ohne Skripte oder externe Verweise hoch (max. 1 MB).
OFFICE_REQUIRED=Wähle ein Büro für einen Bürotag aus.
DATE_INVALID=Verwende ein gültiges Kalenderdatum.
WORKDAY_INTERVAL_INVALID=Die Endzeit muss nach der Startzeit liegen.
COORDINATES_INVALID=Die Ressourcenkoordinaten müssen innerhalb des Etagenplans liegen.
CAPACITY_INVALID=Ein Raum muss eine positive Kapazität haben.
RESOURCE_TYPE_IMMUTABLE=Der Typ einer bestehenden Ressource kann nicht geändert werden.
CAPACITY_BOOKING_CONFLICT=Eine bevorstehende Buchung überschreitet die neue Kapazität.
SCHEDULE_INTERVAL_INVALID=Die Endzeit muss nach der Startzeit am selben Tag liegen.
TIMESTAMP_INVALID=Verwende einen ISO-Zeitstempel mit Z oder einer expliziten UTC-Abweichung.
BOOKING_INTERVAL_INVALID=Das Buchungsende muss nach dem Buchungsbeginn liegen.
TEAM_RESTRICTED=Diese Ressource ist Mitgliedern des zugeordneten Teams vorbehalten.
ATTENDEES_INVALID=Die Teilnehmerzahl muss eine positive ganze Zahl sein.
CAPACITY_EXCEEDED=Diese Ressource bietet Platz für höchstens {0} Teilnehmer.
BOOKING_CONFLICT=Diese Ressource ist für diesen Zeitraum bereits gebucht.
DUPLICATE_ENTRY=Ein Eintrag mit denselben Werten für {0} ist bereits vorhanden.
ENTRY_REFERENCED=Dieser Eintrag wird von {0} verwendet. Entferne die Verknüpfung oder deaktiviere den Eintrag.

PLAN_IMAGE_INVALID=Wähle ein gültiges JPG- oder PNG-Bild bis 5 MB.
PLAN_IMAGE_DIMENSIONS=Bildbreite und Bildhöhe müssen jeweils zwischen 100 und 10000 Pixeln liegen.
PLAN_RESIZE_CONFLICT=Einige Bereiche würden außerhalb des neuen Plans liegen. Verschiebe, verkleinere oder entferne diese Bereiche vor dem Ersetzen des Bildes.
PLAN_OBJECT_BOUNDS=Der Bereich muss innerhalb des Etagenplans liegen. Der Radius darf höchstens die Hälfte der kürzeren Seite betragen; die Deckkraft muss zwischen 0 und 1 liegen.
PLAN_OBJECT_COLOR=Verwende eine Farbe im Format #RRGGBB.
PLAN_OBJECT_FLOOR=Die verknüpfte Ressource muss zu dieser Etage gehören.
PLAN_OBJECT_TYPE=Wähle einen Bereichstyp, der zur verknüpften Ressource passt. Schreibtische und Zonen werden mit Arbeitsplätzen verknüpft.

LOGIN_REQUIRED=Bitte melde dich an.
ACCESS_DENIED=Deine Rolle erlaubt diese Aktion nicht.
OWN_RECORDS_ONLY=Du kannst Buchungen und Arbeitspläne nur für dich selbst erstellen und bearbeiten.
BOOKING_OWNER_IMMUTABLE=Der Eigentümer kann nicht geändert werden.
ROLE_ASSIGNMENT_DENIED=Schlüsselbenutzer können nur reguläre Benutzer im eigenen Unternehmen anlegen.
LAST_ADMIN_REQUIRED=Mindestens ein aktiver Administrator muss erhalten bleiben.
CURRENT_PASSWORD_INVALID=Das aktuelle Passwort ist falsch.
PASSWORD_LENGTH=Das Passwort muss 12 bis 256 Zeichen enthalten.
EMAIL_EXISTS=Diese E-Mail-Adresse wird bereits verwendet.
LOGIN_INVALID=E-Mail oder Passwort ist falsch oder das Konto ist inaktiv.
LOGIN_RATE_LIMIT=Zu viele Anmeldeversuche. Versuche es in einer Minute erneut.
LOGIN_FAILED=Anmeldung fehlgeschlagen. Bitte versuche es erneut.
SETUP_UNAVAILABLE=Die Einrichtung des Administrators wurde bereits abgeschlossen.
SETUP_TOKEN_INVALID=Der Einrichtungstoken ist ungültig.
SETUP_USER_INVALID=Gib die E-Mail eines vorhandenen aktiven Benutzers ein.

PROFILE_UNAVAILABLE=Wähle einen aktiven Benutzer aus der Liste.
PROFILE_LOGIN_ENABLED=Die Profilauswahl ist aktiviert. Passwort und Einrichtungstoken werden nicht benötigt.

BUILDING_KIND_IMMUTABLE=Die Art eines vorhandenen Gebäudes oder einer Parkanlage kann nicht geändert werden.
PARKING_RESOURCE_REQUIRED=In einer Parkanlage können nur Stellplätze angelegt werden.
PARKING_CAPACITY=Ein Stellplatz bietet Platz für ein Fahrzeug.
